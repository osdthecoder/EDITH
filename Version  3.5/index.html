<title>EDITH</title>
<style>

:root[data-theme="dark"]{--bg:#0B0B0F}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
nav{background:var(--bg2);border-right:1px solid var(--bd);width:230px;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo b{letter-spacing:.04em;font-size:18px}.logo small{display:block;color:var(--tx2);font-size:10px;letter-spacing:.05em}
nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:12px;color:var(--tx2)}
nav button.on{background:var(--card);color:var(--tx);box-shadow:inset 3px 0 var(--ac)}
nav button:hover{color:var(--tx)}
main{flex:1;min-width:0;padding:28px;max-width:1000px}
h1{margin:0 0 4px;font-size:26px}h2{font-size:17px;margin:28px 0 12px}
.sub{color:var(--tx2);margin:0 0 18px}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font:inherit}
.search:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:left;transition:border-color .15s,transform .15s}
button.card:hover{border-color:var(--ac);transform:translateY(-2px)}
.card h3{margin:0 0 4px;font-size:15px}.card p{margin:0;color:var(--tx2);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--tx2);margin-top:8px}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.brand{background:linear-gradient(135deg,#1C1C25,#15151C);border:1px solid var(--bd);border-radius:20px;padding:22px;margin-bottom:20px}
.brand small{color:var(--tx2);letter-spacing:.1em}.brand .n{font-size:34px;letter-spacing:.06em;font-weight:700;margin:2px 0}.brand em{color:var(--ac);font-style:normal}
.btn{background:var(--ac);border:0;border-radius:12px;padding:10px 16px;font-weight:600}
.btn.g{background:var(--card);border:1px solid var(--bd)}.btn:disabled{opacity:.45;cursor:not-allowed}
.drop{border:2px dashed var(--bd);border-radius:18px;padding:34px 16px;text-align:center;color:var(--tx2);background:var(--bg2)}
.drop.over{border-color:var(--ac);color:var(--tx)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px;flex-wrap:wrap}
.err{color:var(--er);font-size:14px;margin-top:8px}.empty{color:var(--tx2);text-align:center;padding:30px;border:1px dashed var(--bd);border-radius:16px}

.app{flex-direction:column}

nav .logo{display:none}nav button{white-space:nowrap;font-size:13px;padding:9px 11px}
main{padding:18px 16px 90px}}
