name: Fetch password engine
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find app folder
        run: |
          M=$(find . -mindepth 2 -name manifest.json -not -path './.git/*' | head -1)
          [ -n "$M" ] || { echo "No app folder found"; exit 1; }
          echo "APP_DIR=$(dirname "$M")" >> "$GITHUB_ENV"
      - name: Download qpdf (WebAssembly)
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request as u
          P = "@neslinesli93/qpdf-wasm"
          v = json.load(u.urlopen("https://data.jsdelivr.com/v1/package/resolve/npm/%s@latest" % P))["version"]
          files = [f["name"] for f in json.load(u.urlopen("https://data.jsdelivr.com/v1/package/npm/%s@%s/flat" % (P, v)))["files"]]
          print("version", v); print(files)
          def pick(ext):
              c = [f for f in files if f.endswith(ext) and "qpdf" in f.split("/")[-1]]
              return sorted(c, key=lambda f: (0 if "/dist/" in f else 1, len(f)))[0]
          d = os.environ["APP_DIR"] + "/lib"
          os.makedirs(d, exist_ok=True)
          for ext, name in ((".js", "qpdf.js"), (".wasm", "qpdf.wasm")):
              f = pick(ext)
              open(d + "/" + name, "wb").write(u.urlopen("https://cdn.jsdelivr.net/npm/%s@%s%s" % (P, v, f)).read())
              print("saved", f)
          open(d + "/qpdf-version.txt", "w").write(v)
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APP_DIR/lib"
          git commit -m "Add password engine" || echo "Nothing to commit"
          git push
